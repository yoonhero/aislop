<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HiBulb · Notebook</title>
  <link rel="icon" href="icons/hibulb.png">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="sticky.css">
</head>
<body class="notebook">
  <aside id="sidebar">
    <header class="brand"><img src="icons/hibulb.png" alt="">HiBulb</header>
    <label class="search"><span class="sr-only">Search notebook</span><input id="search" type="search" placeholder="Find a note or passage…"></label>
    <nav id="entries" aria-label="Saved article notebooks"></nav>
    <footer>
      <label class="file">Import<input id="importFile" type="file" accept=".json,.jsonl"></label>
      <button id="exportBtn" type="button">Export</button>
      <output id="notice" role="status"></output>
    </footer>
  </aside>
  <main id="reader"></main>
  <script src="scope.js"></script>
  <script src="model.js"></script>
  <script src="anchors.js"></script>
  <script src="note-preview.js"></script>
  <script src="sticky.js"></script>
  <script src="review.js"></script>
</body>
</html>
