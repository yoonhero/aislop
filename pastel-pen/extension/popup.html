<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HiBulb</title>
  <link rel="icon" href="icons/hibulb.png">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header><strong class="popup-brand"><img src="icons/hibulb.png" alt="">HiBulb</strong><button id="review" type="button">Notebook</button></header>
  <p id="pageLabel"></p>
  <label class="eyebrow" for="scope">Apply to</label>
  <select id="scope">
    <option value="page">This page</option>
    <option value="path">This path and below</option>
    <option value="domain">This entire domain</option>
  </select>
  <p id="scopeHint"></p>
  <button id="toggle" class="page-toggle" type="button"></button>
  <div class="eyebrow">Default colour</div>
  <div id="colors" class="colors" aria-label="Default pen colour"></div>
  <script src="scope.js"></script>
  <script src="model.js"></script>
  <script src="popup.js"></script>
</body>
</html>
